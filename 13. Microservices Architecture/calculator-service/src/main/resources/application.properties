spring.application.name=calculator-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Pull configuration from the Config Server. "optional:" lets the service still
# start if the config server is briefly unavailable; when it is up, the
# calculator.greeting value is fetched from calculator-service.properties.
spring.config.import=optional:configserver:http://localhost:8888
