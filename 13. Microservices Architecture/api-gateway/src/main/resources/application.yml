server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: calculator-service
              uri: lb://calculator-service
              predicates:
                - Path=/math/**

            - id: math-facade-service
              uri: lb://math-facade-service
              predicates:
                - Path=/api/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
