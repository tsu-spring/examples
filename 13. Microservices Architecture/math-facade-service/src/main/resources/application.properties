spring.application.name=math-facade-service
server.port=8082
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Resilience4j circuit breaker protecting the call to calculator-service.
resilience4j.circuitbreaker.instances.calculatorService.sliding-window-size=10
resilience4j.circuitbreaker.instances.calculatorService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.calculatorService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.calculatorService.permitted-number-of-calls-in-half-open-state=3
